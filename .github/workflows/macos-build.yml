name: Build macOS (Motivation)

# MANUAL TRIGGER ONLY: this workflow never runs on its own — it only spends
# macOS minutes when someone clicks "Run workflow" in the Actions tab.
#
# macOS TARGET (Nov 27, 2026): the Mac app is a react-native-macos target
# (folder macos/, committed — Expo prebuild does NOT generate it) sharing
# the app's JS via platform variants (app/(tabs)/_layout.macos.tsx sidebar
# UI, lib/purchases.macos.ts store-disconnected Haven Plus,
# lib/notifications.macos.ts no-op local notifications) and the
# metro.config.js macOS resolver shim.
#
# ⚠️ PROFILE NAME — NOTE THE AMPERSAND:
# The archive/export steps below expect a Mac App Store Connect
# distribution profile named exactly:
#
#     Hustle & Heart Motivation
#
# That is the MAC profile's name, with "&". The iOS profile is spelled
# "Hustle And Heart Motivation" — do NOT copy the iOS spelling here; if
# the Mac profile is ever renamed in the portal, update MAC_PROFILE_NAME
# below AND the PROVISIONING_PROFILE_SPECIFIER in
# macos/above-all.xcodeproj/project.pbxproj together (the export step
# no longer names a profile — see its comment), or signing will fail.
#
# ⚠️ VERSION MISMATCH RISK (known, accepted, same as the Flight Journal
# pilot): the app runs react-native 0.86 (Expo SDK 57). react-native-
# macos — a community fork — currently tops out at 0.83.0 (peer
# react-native 0.83.10); there is NO react-native-macos release paired
# with RN 0.86. The macOS target therefore builds the app's JS against
# the react-native-macos 0.83 fork (metro maps 'react-native' →
# 'react-native-macos' for the macos platform only; ios/android/web
# keep using RN 0.86 untouched). JS bundling for macos is verified
# locally, and the macOS codegen simulation (react-native-macos 0.83's
# generate-codegen-artifacts.js, with the env-gated exclusions in
# react-native.config.js) exits 0 — but the 0.83↔0.86 gap can still
# bite at native-compile or runtime in ways only the first run of this
# workflow can reveal.
#
# ⚠️ NO AUTO-BUMP IN THIS WORKFLOW (deliberate divergence from the
# iOS/Android workflows): .github/scripts/bump-build-number.py bumps
# app.json's iOS buildNumber + Android versionCode in sync and is
# owned by those workflows (they commit the new number back). The Mac
# build instead READS the current version/build from app.json and
# stamps them into the Mac archive. Consequence: App Store Connect
# rejects a second Mac upload with the SAME build number — before
# re-running this workflow, advance the number (any iOS/Android
# workflow run does it, or edit app.json's ios.buildNumber by hand).
# There is intentionally no commit-back step here.
#
# HUMAN PREREQUISITES (Joey):
#   1. macOS platform added to the existing App Store Connect record
#      for com.beatrackfaminc.motivation.
#   2. Mac App Store Connect distribution profile created with the
#      exact name above (type "Mac", not Catalyst; App ID
#      com.beatrackfaminc.motivation).
#   3. Repo secrets already exist from the iOS workflow:
#      ASC_API_KEY_ID, ASC_API_KEY_P8, ASC_API_ISSUER_ID,
#      APPLE_TEAM_ID, IOS_DISTRIBUTION_P12, IOS_DISTRIBUTION_PASSWORD
#      (the same Apple Distribution certificate signs Mac builds),
#      plus EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY
#      (baked into the JS bundle at archive time, same as iOS).
#   4. NO App Clip on macOS — App Clips are iOS-only, so there is no
#      Mac clip profile and nothing to embed.

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the .pkg to App Store Connect (TestFlight / Mac App Store) after building'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # ⚠️ Must match the Mac profile name in the Developer portal exactly
  # (ampersand — NOT the iOS profile's "Hustle And Heart Motivation") —
  # this is the canonical record of the name the app target's
  # PROVISIONING_PROFILE_SPECIFIER (in the macos project) must carry.
  # The export step no longer reads it (automatic signing, run #9 fix
  # pattern from the Flight Journal pilot).
  MAC_PROFILE_NAME: 'Hustle & Heart Motivation'

jobs:
  build-macos:
    name: Archive Hustle & Heart Motivation macOS (Release)
    runs-on: macos-26
    timeout-minutes: 120
    # Supabase config for optional sign-in / Together features — same
    # job env as ios-build.yml; Metro inlines EXPO_PUBLIC_* into the
    # JS bundle during the archive's bundle phase.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read app version and build number from app.json
        # Read-only (no bump — see the header comment). The Mac archive
        # is stamped with these via MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION overrides at archive time.
        run: |
          echo "APP_VERSION=$(jq -r '.expo.version' app.json)" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(jq -r '.expo.ios.buildNumber' app.json)" >> "$GITHUB_ENV"
          echo "Mac build will be stamped version $APP_VERSION ($APP_BUILD from app.json)."

      - name: Select the newest Xcode on the runner
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # --legacy-peer-deps is required in ALL THREE build workflows:
      # react-native-macos@0.83.0 lives in the SHARED package.json (it
      # is a devDependency of the one project all platforms build
      # from) and declares a peer on react-native@0.83.10 while the
      # app runs react-native@0.86, so a strict npm ci dies with
      # ERESOLVE before anything installs — on iOS and Android too,
      # not just here. The flag only skips peer enforcement: the
      # lockfile pins every version, so the installed tree is
      # identical with or without it. Keep the flag in
      # ios-build.yml / android-build.yml in sync with this one for
      # as long as react-native-macos is a project dependency.
      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Install CocoaPods (macOS target)
        # The macos/ project is committed (generated by
        # react-native-macos-init, then adapted: bundle ID
        # com.beatrackfaminc.motivation, Expo entry file + "main"
        # module name). No expo prebuild step — prebuild has no macOS
        # target and must not touch this folder.
        working-directory: macos
        run: pod install

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          mkdir -p "$HOME/private_keys"
          raw="$ASC_API_KEY_P8"
          # Undo common paste accidents: surrounding quotes, CR characters,
          # and literal \n sequences instead of real line breaks.
          raw="${raw#\"}"; raw="${raw%\"}"
          raw="${raw#\'}"; raw="${raw%\'}"
          raw="$(printf '%s' "$raw" | tr -d '\r')"
          if [[ "$raw" != *$'\n'* ]]; then
            raw="$(printf '%s' "$raw" | sed 's/\\n/\n/g')"
          fi
          # If the BEGIN/END lines were lost, wrap the base64 body again.
          if [[ "$raw" != *"BEGIN PRIVATE KEY"* ]]; then
            body="$(printf '%s' "$raw" | tr -d '[:space:]')"
            raw="$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(printf '%s' "$body" | fold -w 64)")"
          fi
          printf '%s\n' "$raw" > "$KEY_FILE"
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error::The ASC_API_KEY_P8 secret is not a valid .p8 key. Re-paste the full contents of the .p8 file from App Store Connect, including the BEGIN/END lines."
            exit 1
          fi

      - name: Import distribution certificate
        env:
          P12_B64: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          P12_PW: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          printf '%s' "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          # Never auto-lock mid-build: a locked keychain makes codesign hang
          # silently.
          security set-keychain-settings -lut 7200 build.keychain
          # Search ONLY this keychain so a generic identity name can't resolve
          # ambiguously against stale certs in the login keychain.
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/dist.p12" -k build.keychain -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          # Pin the exact signing identity (SHA-1) instead of the generic
          # "iPhone Distribution" or "Apple Distribution" name.
          IDENT_SHA=$(security find-identity -v -p codesigning build.keychain | grep -m1 -E 'iPhone Distribution|Apple Distribution' | awk '{print $2}')
          if [ -z "$IDENT_SHA" ]; then
            echo "::error::No iPhone/Apple Distribution identity found in build.keychain after import."
            security find-identity -v -p codesigning build.keychain || true
            exit 1
          fi
          echo "Using signing identity $IDENT_SHA"
          echo "DIST_SIGN_IDENTITY=$IDENT_SHA" >> "$GITHUB_ENV"
          echo "Certificate imported."

      - name: Install the Mac provisioning profile (downloaded from App Store Connect)
        # WHY THIS STEP EXISTS (Nov 28, 2026 — Mac runs #1-#3): every
        # archive attempt failed with
        #   error: No profile for team matching
        #   'Hustle & Heart Motivation' found
        # even though the profile exists in the portal (macOS /
        # App Store / com.beatrackfaminc.motivation / Valid, exp
        # 2027-11-07), was regenerated in place (Edit -> Save), and
        # this repo + workflow are verified 1:1 with the green
        # Flight Journal and Rewards Mac setups. The one remaining
        # difference: this profile's name is the only one in the
        # fleet containing "&", and the leading theory is that
        # Xcode's -allowProvisioningUpdates by-name fetch — the
        # mechanism the green apps rely on; they install nothing —
        # fails to match that name, so the profile never lands on
        # the runner and manual signing has nothing to find.
        #
        # This step removes the fetch from the equation: using the
        # SAME App Store Connect API key the archive step below
        # authenticates with, it downloads the EXISTING profile
        # from the ASC API and installs the .mobileprovision into
        # both directories Xcode searches
        # (~/Library/MobileDevice/Provisioning Profiles and
        # ~/Library/Developer/Xcode/UserData/Provisioning Profiles).
        # NO new profile is created and the portal record is
        # untouched. The archive step is unchanged: with the profile
        # physically installed, the app target's in-project
        # PROVISIONING_PROFILE_SPECIFIER resolves locally.
        #
        # Self-diagnosing by design: the step fails loudly unless
        # the API returns EXACTLY ONE Mac profile with this name,
        # cross-checks the decoded .mobileprovision's internal
        # Name/UUID against the API record before installing, and
        # logs the installed profile's name, UUID, platform and
        # expiration. Implementation: an ES256 JWT built with
        # python3 stdlib + the openssl CLI (openssl's DER signature
        # is converted to the raw R||S form JWT requires, in pure
        # python) — no pip installs. The filter[name] value MUST be
        # percent-encoded (the name's "&" would otherwise split the
        # query string); the script encodes it with
        # urllib.parse.quote.
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          python3 - "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" "$ASC_API_KEY_ID" "$ASC_API_ISSUER_ID" "$MAC_PROFILE_NAME" <<'PYEOF'
          import base64
          import json
          import os
          import plistlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          # Args: <authkey .p8 path> <ASC key id> <ASC issuer id> <exact profile name>
          KEY_PATH = sys.argv[1]
          KEY_ID = sys.argv[2]
          ISSUER_ID = sys.argv[3]
          PROFILE_NAME = sys.argv[4]

          API_BASE = "https://api.appstoreconnect.apple.com/v1/profiles"
          PROFILE_DIRS = [
              os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles"),
              os.path.expanduser("~/Library/Developer/Xcode/UserData/Provisioning Profiles"),
          ]


          def fail(msg):
              # ::error:: makes the message a workflow annotation; stderr + exit 1
              # fails the step loudly. Never include the JWT or key material here.
              print("::error::Install Mac provisioning profile: " + msg, file=sys.stderr)
              sys.exit(1)


          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")


          def der_to_raw(der):
              # openssl emits an ASN.1 DER ECDSA signature: SEQUENCE(INTEGER r, INTEGER s),
              # each INTEGER big-endian and possibly 0x00-prefixed or shorter than 32 bytes.
              # JWS (the JWT signature) needs the raw 64-byte form: r and s each padded to
              # exactly 32 bytes, concatenated.
              if len(der) < 2 or der[0] != 0x30:
                  raise ValueError("signature is not a DER SEQUENCE")
              idx = 2
              if der[1] & 0x80:
                  idx = 2 + (der[1] & 0x7F)
              parts = []
              for _ in range(2):
                  if idx + 2 > len(der) or der[idx] != 0x02:
                      raise ValueError("expected a DER INTEGER in the signature")
                  ln = der[idx + 1]
                  val = der[idx + 2: idx + 2 + ln].lstrip(b"\x00")
                  if len(val) > 32:
                      raise ValueError("ECDSA integer is longer than 32 bytes")
                  parts.append(val.rjust(32, b"\x00"))
                  idx += 2 + ln
              return parts[0] + parts[1]


          def make_jwt():
              now = int(time.time())
              header = {"alg": "ES256", "kid": KEY_ID, "typ": "JWT"}
              # ASC rejects tokens whose exp is more than 20 minutes after iat;
              # 19 minutes leaves a small clock-skew margin.
              payload = {"iss": ISSUER_ID, "iat": now, "exp": now + 19 * 60,
                         "aud": "appstoreconnect-v1"}
              signing_input = (
                  b64url(json.dumps(header, separators=(",", ":")).encode("utf-8"))
                  + "."
                  + b64url(json.dumps(payload, separators=(",", ":")).encode("utf-8"))
              )
              tmpdir = tempfile.mkdtemp(prefix="asc-jwt-")
              try:
                  msg_path = os.path.join(tmpdir, "signing-input.txt")
                  der_path = os.path.join(tmpdir, "signature.der")
                  with open(msg_path, "wb") as f:
                      f.write(signing_input.encode("ascii"))
                  proc = subprocess.run(
                      ["openssl", "dgst", "-sha256", "-sign", KEY_PATH,
                       "-out", der_path, msg_path],
                      capture_output=True, text=True)
                  if proc.returncode != 0:
                      fail("openssl could not sign the ASC JWT with %s: %s"
                           % (KEY_PATH, proc.stderr.strip()))
                  with open(der_path, "rb") as f:
                      der = f.read()
              finally:
                  shutil.rmtree(tmpdir, ignore_errors=True)
              return signing_input + "." + b64url(der_to_raw(der))


          def profiles_url(params):
              # Keys stay literal (filter[name]= is the API's canonical form); values
              # are percent-encoded with safe="" so the "&" in the profile name becomes
              # %26 instead of splitting the query into a bogus extra parameter.
              qs = "&".join("%s=%s" % (k, urllib.parse.quote(v, safe=""))
                            for k, v in params)
              return API_BASE + "?" + qs


          def api_get(url, token):
              print("GET " + url)
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  fail("App Store Connect API returned HTTP %d. Response body:\n%s"
                       % (e.code, body))
              except urllib.error.URLError as e:
                  fail("Could not reach the App Store Connect API: %s" % (e.reason,))


          def brief(entry):
              a = entry.get("attributes", {})
              return "id=%s name=%r platform=%s profileType=%s" % (
                  entry.get("id"), a.get("name"), a.get("platform"),
                  a.get("profileType"))


          def select_profile(token):
              url = profiles_url([("filter[name]", PROFILE_NAME),
                                  ("filter[profileType]", "MAC_APP_STORE")])
              data = api_get(url, token).get("data", [])
              if len(data) == 1:
                  return data[0]
              if len(data) > 1:
                  fail("filter[name]+filter[profileType]=MAC_APP_STORE returned %d "
                       "profiles; expected exactly one. Matches: %s"
                       % (len(data), "; ".join(brief(d) for d in data)))
              print("No MAC_APP_STORE match for that name; retrying without the "
                    "profileType filter and selecting platform == MAC_OS...")
              url = profiles_url([("filter[name]", PROFILE_NAME)])
              data = api_get(url, token).get("data", [])
              mac = [d for d in data
                     if d.get("attributes", {}).get("platform") == "MAC_OS"]
              if len(mac) != 1:
                  fail("name-only query returned %d profile(s), %d of them with "
                       "platform MAC_OS; expected exactly one MAC_OS profile named "
                       "%r. Matches: %s"
                       % (len(data), len(mac), PROFILE_NAME,
                          "; ".join(brief(d) for d in data) or "(none)"))
              return mac[0]


          def main():
              token = make_jwt()
              entry = select_profile(token)
              attrs = entry.get("attributes", {})
              uuid = entry.get("id") or attrs.get("uuid")
              if not uuid:
                  fail("the matched profile has no id/uuid: %s" % brief(entry))
              if attrs.get("name") not in (None, PROFILE_NAME):
                  fail("API returned a profile whose name is %r, not %r."
                       % (attrs.get("name"), PROFILE_NAME))
              if attrs.get("platform") not in (None, "MAC_OS"):
                  fail("API returned a profile whose platform is %r, not MAC_OS."
                       % (attrs.get("platform"),))
              content_b64 = attrs.get("profileContent")
              if not content_b64:
                  fail("the matched profile (%s) has no profileContent to install."
                       % brief(entry))
              content = base64.b64decode(content_b64)

              # The .mobileprovision is a CMS-signed plist: pull the XML plist out of
              # the decoded bytes and cross-check it against the API record BEFORE
              # installing anything, so a wrong or corrupt download fails here with a
              # clear message instead of surfacing as a signing error at archive time.
              start = content.find(b"<?xml")
              end = content.find(b"</plist>")
              if start < 0 or end < 0:
                  fail("decoded profileContent (%d bytes) contains no plist; "
                       "refusing to install it." % len(content))
              plist = plistlib.loads(content[start:end + len(b"</plist>")])
              if plist.get("Name") != PROFILE_NAME:
                  fail("the downloaded .mobileprovision's internal Name is %r, "
                       "not %r; refusing to install it."
                       % (plist.get("Name"), PROFILE_NAME))
              if plist.get("UUID") != uuid:
                  fail("the downloaded .mobileprovision's internal UUID is %r, "
                       "but the API record id is %r; refusing to install it."
                       % (plist.get("UUID"), uuid))

              filename = uuid + ".mobileprovision"
              for directory in PROFILE_DIRS:
                  os.makedirs(directory, exist_ok=True)
                  dest = os.path.join(directory, filename)
                  with open(dest, "wb") as f:
                      f.write(content)
                  print("Installed: " + dest)

              print("Provisioning profile installed from App Store Connect:")
              print("  Name:           " + str(plist.get("Name")))
              print("  UUID:           " + str(plist.get("UUID")))
              print("  Platform (API): " + str(attrs.get("platform")))
              print("  Type (API):     " + str(attrs.get("profileType")))
              print("  Expires (API):  " + str(attrs.get("expirationDate")))
              print("  Expires (file): " + str(plist.get("ExpirationDate")))


          if __name__ == "__main__":
              main()
          PYEOF

      - name: Archive the Mac app (manual signing)
        # Step-level cap: a healthy archive finishes well under this.
        # The provisioning profile is scoped IN THE PROJECT — the app
        # target's Release configuration in
        # macos/above-all.xcodeproj/project.pbxproj carries
        # PROVISIONING_PROFILE_SPECIFIER = "Hustle & Heart Motivation"
        # — and is deliberately NOT passed on this command line: a
        # command-line PROVISIONING_PROFILE_SPECIFIER applies to
        # EVERY target in the workspace, and the Flight Journal pilot
        # (run #4, Nov 27, 2026) failed validation with "OpenAP_OpenIAP
        # does not support provisioning profiles" because Swift
        # Package Manager targets (react-native-iap's OpenIAP,
        # integrated via CocoaPods) cannot carry provisioning
        # profiles. DEVELOPMENT_TEAM, CODE_SIGN_STYLE and
        # CODE_SIGN_IDENTITY stay global here — they are harmless on
        # SPM targets; the pilot run's only error was the profile.
        # If the portal profile is ever renamed, update
        # MAC_PROFILE_NAME below AND the project setting above
        # together.
        timeout-minutes: 50
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace macos/above-all.xcworkspace \
            -scheme above-all-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$GITHUB_WORKSPACE/build/Motivation-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DIST_SIGN_IDENTITY" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD"

      - name: Export the .pkg
        # MAC APP STORE export: method=app-store-connect is the current
        # name of the App Store method — this app ships through App
        # Store Connect (portal record + Mac profile + separate
        # review), NOT Developer ID direct distribution.
        #
        # signingStyle=automatic HERE ONLY — the archive step above
        # stays manual; do not "align" them. Flight Journal Mac run #9
        # (Nov 27, 2026) archived successfully, then this step failed
        # (exit 70) with:
        #   error: exportArchive No signing certificate
        #   "Mac Installer Distribution" found
        # A Mac App Store .pkg must be signed with a "Mac Installer
        # Distribution" certificate, but the imported .p12 carries
        # only the app distribution certificate, and under
        # signingStyle=manual xcodebuild will not create the missing
        # one. With automatic signing + -allowProvisioningUpdates +
        # the App Store Connect API key flags below, xcodebuild can
        # create/download the installer certificate at export time.
        # (Certificate creation via an API key depends on the key's
        # role — an Admin-role key can create certificates. If a
        # future run still fails with the same error, the fallback is
        # to create a "Mac Installer Distribution" certificate in the
        # portal and add it to the imported .p12.)
        #
        # destination=export is explicit so the path stays singular:
        # the .pkg lands in build/pkg and the steps below (run
        # artifact + altool upload) are the ONE upload path.
        # destination=upload would have xcodebuild upload directly
        # and leave no .pkg for those steps.
        #
        # No provisioningProfiles dict: under automatic signing Xcode
        # manages profiles itself, and the archive already embeds the
        # Mac profile scoped in the project (see the archive step).
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$GITHUB_WORKSPACE/build/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/Motivation-macOS.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/pkg" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Upload the .pkg as a run artifact
        uses: actions/upload-artifact@v6
        with:
          name: HustleHeart-macOS-${{ env.APP_VERSION }}-${{ env.APP_BUILD }}-pkg
          path: build/pkg/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build to App Store Connect (TestFlight / Mac App Store)
        if: inputs.upload_to_testflight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          PKG="$(ls "$GITHUB_WORKSPACE"/build/pkg/*.pkg | head -1)"
          echo "Uploading $PKG to App Store Connect..."
          # altool looks for AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          ok=""
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt of 3..."
            if xcrun altool --upload-app --type macos --file "$PKG" \
                 --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"; then
              ok=1; break
            fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::Upload failed after 3 attempts. The .pkg is still saved as a run artifact above — upload that file in Transporter instead."
            exit 1
          fi
          echo "Uploaded. Apple processes the build (usually ~5-30 min), then it appears under the app's macOS platform in App Store Connect / TestFlight."

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/private_keys"
